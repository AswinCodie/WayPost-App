services:
  - type: web
    name: waypost-json-api
    runtime: node
    buildCommand: npm ci
    startCommand: >-
      if [ ! -f /var/data/db.json ]; then cp db.json /var/data/db.json; fi;
      npx json-server /var/data/db.json --host 0.0.0.0 --port $PORT
    healthCheckPath: /accounts
    disk:
      name: waypost-data
      mountPath: /var/data
      sizeGB: 1
